<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F2;
  --ink:#16323C;
  --ink-soft:#5B7580;
  --rule:#C6CFD1;
  --amber:#C97B2B;
  --sea:#2F7D8C;
  --padel:#6E7B3F;
  --steps:#8C5A6E;
  --card:#F7F9F9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 64px}

header{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:24px}
h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.02em;
}
.sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.09em;margin-top:8px}

.daynav{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.daylabel{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:18px}
.navbtns{display:flex;gap:6px}
.navbtns button{
  font-family:'IBM Plex Mono',monospace;font-size:13px;
  background:none;border:1px solid var(--rule);color:var(--ink-soft);
  border-radius:2px;padding:3px 9px;cursor:pointer;
}
.navbtns button:hover{border-color:var(--ink);color:var(--ink)}
.navbtns button[disabled]{opacity:.3;cursor:default}

.meals{display:grid;gap:8px;margin-bottom:26px}
.meal{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.meal:hover{border-color:var(--ink-soft)}
.meal .tick{
  width:20px;height:20px;flex:0 0 20px;border:1.5px solid var(--rule);border-radius:2px;
  display:grid;place-items:center;
}
.meal .tick svg{width:13px;height:13px;opacity:0;transform:scale(.7);transition:.15s}
.meal .name{flex:1;font-weight:500}
.meal .hour{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}
.meal.on{background:#E4EAEC;border-color:var(--ink)}
.meal.on .tick{background:var(--ink);border-color:var(--ink)}
.meal.on .tick svg{opacity:1;transform:scale(1)}
.meal.anchor.on{background:#F6E9D9;border-color:var(--amber)}
.meal.anchor.on .tick{background:var(--amber);border-color:var(--amber)}
.meal.anchor .name em{font-style:normal;color:var(--amber);font-family:'IBM Plex Mono',monospace;
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-top:1px}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
.tag{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  background:none;border:1px dashed var(--rule);color:var(--ink-soft);
  border-radius:20px;padding:5px 12px;cursor:pointer;transition:.15s;
}
.tag:hover{border-color:var(--ink-soft);color:var(--ink)}
.tag.on{background:var(--ink);border-style:solid;border-color:var(--ink);color:var(--paper)}
.tag.body.on{background:var(--sea);border-color:var(--sea)}
.tag.body.on[data-t="padel"]{background:var(--padel);border-color:var(--padel)}
.tag.body.on[data-t="pas8000"]{background:var(--steps);border-color:var(--steps)}
.tags.body{margin-bottom:22px}

/* bande 7 jours — la signature */
.strip{border-top:1px solid var(--rule);padding-top:20px;margin-bottom:8px}
.band{display:grid;grid-template-columns:58px repeat(7,1fr);gap:5px 5px;align-items:center}
.rowlbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);
  text-align:right;line-height:1.1;padding-right:3px}
.col{display:flex;flex-direction:column;gap:4px}
.seg{height:22px;border-radius:2px;border:1px dashed var(--rule);background:transparent}
.seg.on{background:var(--ink);border:1px solid var(--ink)}
.seg.anchor.on{background:var(--amber);border-color:var(--amber)}
.act{width:11px;height:11px;border-radius:50%;border:1px solid var(--rule);
  background:transparent;margin:0 auto}
.act.on[data-a="padel"]{background:var(--padel);border-color:var(--padel)}
.act.on[data-a="aqua"]{background:var(--sea);border-color:var(--sea)}
.act.on[data-a="pas8000"]{background:var(--steps);border-color:var(--steps)}
.rowlbl[data-a="padel"]{color:var(--padel)}
.rowlbl[data-a="aqua"]{color:var(--sea)}
.rowlbl[data-a="pas8000"]{color:var(--steps)}
.actrow{height:14px;display:flex;align-items:center;justify-content:center}
.daylbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);
  text-align:center;text-transform:uppercase;padding-top:2px}
.daylbl.today{color:var(--ink);font-weight:500}
.illisible{height:3px;border-radius:2px;background:transparent}
.illisible.on{background:var(--rule)}

.count{margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}
.count .n{font-family:'Bricolage Grotesque',sans-serif;font-size:44px;font-weight:700;
  line-height:1;letter-spacing:-.03em}
.count .txt{font-size:15px;color:var(--ink-soft);margin-top:4px;max-width:44ch}
.note{
  margin-top:16px;border-left:2px solid var(--amber);padding:2px 0 2px 12px;
  font-size:14.5px;color:var(--ink);
}
footer{margin-top:34px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.reset{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cadence</h1>
    <div class="sub">Ce qui manque, pas ce qui rentre</div>
  </header>

  <div class="daynav">
    <div class="daylabel" id="daylabel"></div>
    <div class="navbtns">
      <button id="prev" aria-label="Jour précédent">←</button>
      <button id="next" aria-label="Jour suivant">→</button>
    </div>
  </div>

  <div class="meals" id="meals"></div>

  <p class="eyebrow">Le corps a bougé</p>
  <div class="tags body" id="tagsbody"></div>

  <p class="eyebrow">Ce qui rend la balance illisible</p>
  <div class="tags" id="tags"></div>

  <div class="strip">
    <p class="eyebrow">Sept derniers jours</p>
    <div class="band" id="band"></div>
  </div>

  <div class="count">
    <div class="n" id="count">—</div>
    <div class="txt" id="counttxt"></div>
    <div id="note"></div>
  </div>

  <footer>
    Aucune calorie n'est comptée ici, et c'est volontaire. Le levier n'est pas la quantité, c'est la répartition.
    <br><button class="reset" id="reset">Effacer toutes les données</button>
  </footer>
</div>

<script>
const KEY='carnet_fenetres_v1';
const MEALS=[
  {id:'matin', name:'Matin',            hour:'', anchor:false},
  {id:'midi',  name:'Midi',             hour:'', anchor:false},
  {id:'ancre', name:'Ancre',            hour:'16h30', anchor:true},
  {id:'soir',  name:'Soir',             hour:'', anchor:false},
];
const BODY=[
  {id:'padel',  label:'Padel'},
  {id:'aqua',   label:'Aquagym'},
  {id:'pas8000',label:'8000 pas'},
];
const TAGS=[
  {id:'sel',   label:'Repas salé',      water:true},
  {id:'resto', label:'Restaurant',      water:true},
  {id:'chaud', label:'Chaleur',         water:true},
  {id:'soirfort', label:'Soir compensatoire'},
];
const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#F7F9F9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let data={};
let cursor=0; // 0 = aujourd'hui, -1 = hier…

const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):{};} }catch(e){}
    try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; }
  },
  async set(v){
    const s=JSON.stringify(v);
    try{ if(window.storage){await window.storage.set(KEY,s);return;} }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

const dayKey=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10);};
const dayObj=off=>{const d=new Date();d.setDate(d.getDate()+off);return d;};
const rec=off=>data[dayKey(off)]||{meals:{},tags:{}};

function label(off){
  if(off===0) return "Aujourd'hui";
  if(off===-1) return "Hier";
  return dayObj(off).toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'});
}

function toggle(kind,id){
  const k=dayKey(cursor);
  if(!data[k]) data[k]={meals:{},tags:{}};
  data[k][kind][id]=!data[k][kind][id];
  store.set(data); render();
}

function render(){
  document.getElementById('daylabel').textContent=label(cursor);
  document.getElementById('next').disabled = cursor>=0;
  const r=rec(cursor);

  document.getElementById('meals').innerHTML=MEALS.map(m=>`
    <button class="meal ${m.anchor?'anchor':''} ${r.meals[m.id]?'on':''}" data-m="${m.id}">
      <span class="tick">${CHECK}</span>
      <span class="name">${m.name}${m.anchor?'<em>le point d\'appui</em>':''}</span>
      <span class="hour">${m.hour}</span>
    </button>`).join('');

  document.getElementById('tagsbody').innerHTML=BODY.map(t=>`
    <button class="tag body ${r.tags[t.id]?'on':''}" data-t="${t.id}">${t.label}</button>`).join('');

  document.getElementById('tags').innerHTML=TAGS.map(t=>`
    <button class="tag ${r.tags[t.id]?'on':''}" data-t="${t.id}">${t.label}</button>`).join('');

  // bande 7 jours
  const days=[-6,-5,-4,-3,-2,-1,0];
  let empties=0, anchors=0, html='<div></div>';

  days.forEach(off=>{
    const d=rec(off);
    const segs=MEALS.map(m=>{
      if(!d.meals[m.id] && off<0) empties++;
      if(m.id==='ancre' && d.meals[m.id]) anchors++;
      return `<div class="seg ${m.anchor?'anchor':''} ${d.meals[m.id]?'on':''}"></div>`;
    }).join('');
    html+=`<div class="col">${segs}</div>`;
  });

  BODY.forEach(t=>{
    html+=`<div class="rowlbl" data-a="${t.id}">${t.label}</div>`;
    days.forEach(off=>{
      html+=`<div class="actrow"><div class="act ${rec(off).tags[t.id]?'on':''}" data-a="${t.id}"></div></div>`;
    });
  });

  html+='<div class="rowlbl">illisible</div>';
  days.forEach(off=>{
    const ctx=TAGS.some(t=>rec(off).tags[t.id]);
    html+=`<div class="illisible ${ctx?'on':''}"></div>`;
  });

  html+='<div></div>';
  days.forEach(off=>{
    html+=`<div class="daylbl ${off===0?'today':''}">${dayObj(off).toLocaleDateString('fr-BE',{weekday:'short'}).slice(0,2)}</div>`;
  });

  document.getElementById('band').innerHTML=html;

  document.getElementById('count').textContent=empties;
  document.getElementById('counttxt').textContent =
    empties===0 ? "Aucune fenêtre vide sur les six jours écoulés. Le soir n'a rien à rattraper."
    : empties===1 ? "fenêtre vide sur les six jours écoulés."
    : "fenêtres vides sur les six jours écoulés. Chacune est un trou par lequel le soir se remplit.";

  // note de lecture
  const today=rec(0), yest=rec(-1);
  const water=TAGS.filter(t=>t.water).some(t=>today.tags[t.id]||yest.tags[t.id]);
  let note='';
  if(water) note="Sel ou chaleur dans les dernières 48 h : la balance retient de l'eau, pas de la graisse. Chiffre illisible aujourd'hui — ne conclus rien.";
  else if(anchors>=5) note="L'ancre de 16h30 tient. C'est la seule chose qui change vraiment le soir.";
  document.getElementById('note').innerHTML = note?`<div class="note">${note}</div>`:'';
}

document.getElementById('meals').addEventListener('click',e=>{
  const b=e.target.closest('[data-m]'); if(b) toggle('meals',b.dataset.m);
});
['tags','tagsbody'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('[data-t]'); if(b) toggle('tags',b.dataset.t);
  });
});
document.getElementById('prev').onclick=()=>{cursor--;render();};
document.getElementById('next').onclick=()=>{if(cursor<0){cursor++;render();}};
document.getElementById('reset').onclick=()=>{
  if(confirm('Effacer tout le carnet ?')){data={};store.set(data);render();}
};

(async()=>{ data=await store.get(); render(); })();
</script>
</body>
</html>
